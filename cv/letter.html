<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmetcan Aksu — Cover Letter</title>
<meta name="author" content="Ahmetcan Aksu">
<meta name="robots" content="noindex">

<!--
  ============================================================================
  COVER LETTER  —  companion to cv.html, same editing model
  ============================================================================
  PER APPLICATION, edit only the APPLICATION block below:
      company   the employer's name        -> "" falls back to a generic letter
      role      the job title you apply to -> "" omits the role sentence
      recipient hiring manager's name      -> "" falls back to "To Whom It
                                              May Concern" / "İlgili Makama"
      custom    ONE paragraph on why THIS company. Worth writing every time:
                a letter without it is interchangeable with everyone else's.
                Leave "" to omit the paragraph entirely.
  Then: Cmd/Ctrl + P -> Save as PDF -> A4, margins Default, scale 100%.
  Language: EN / TR button, or open letter.html#tr
  Fits one A4 page. Measured: 10.4pt holds the letter on one page even with
  the application block filled in and a five-line custom paragraph. If you
  write a longer one, press A- (or lower layout.baseFontPt).
  ============================================================================
-->

<style>
  :root{
    color-scheme: light;
    --fs:       10.4pt;
    --ink:      #14181f;
    --ink-soft: #303845;
    --muted:    #5c6675;
    --accent:   #2f5fbf;
    --rule:     #c9d2e0;
  }
  *{ box-sizing:border-box; }
  html{ background:#eceef2; }
  body{
    margin:0;
    /* Arial with ligatures off, for the same reasons as cv.html: system UI
       fonts embed in a Chrome PDF as Type 3, which some parsers can't read,
       and an "fi" ligature extracts as the single glyph "ﬁ". */
    font-family: Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0;
    font-size: var(--fs);
    line-height:1.55;
    color:var(--ink-soft);
    -webkit-font-smoothing:antialiased;
  }

  .toolbar{
    position:sticky; top:0; z-index:10;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px 14px; background:#1b2027; color:#e8ebf0; font-size:12px;
  }
  .toolbar strong{ font-weight:600; margin-right:auto; letter-spacing:.02em; }
  .toolbar button{
    font:inherit; font-weight:500; padding:6px 12px; border-radius:6px; cursor:pointer;
    border:1px solid #3c4553; background:#2a313b; color:#e8ebf0;
  }
  .toolbar button:hover{ background:#343d49; }
  .toolbar button[aria-pressed="true"]{ background:#dfe4ec; color:#1b2027; border-color:#dfe4ec; }
  .toolbar .hint{ color:#98a2b3; font-size:11px; }

  .sheet{
    width:210mm; margin:18px auto 40px; padding:16mm 18mm;
    background:#fff;
    box-shadow:0 1px 3px rgba(20,24,31,.14), 0 10px 34px rgba(20,24,31,.10);
  }

  header.masthead{ padding-bottom:7px; border-bottom:2px solid var(--accent); }
  h1{ margin:0; font-size:24pt; line-height:1.03; font-weight:700; letter-spacing:-.015em; color:var(--ink); }
  .role{ margin-top:4px; font-size:10pt; font-weight:600; color:var(--accent); letter-spacing:.055em; text-transform:uppercase; }
  .contact{ margin:6px 0 0; font-size:9pt; line-height:1.55; }
  .contact a{ color:var(--ink-soft); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
  .contact .sep{ color:var(--rule); margin:0 .1em; }
  .contact .ci{ white-space:nowrap; }

  .meta-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12mm;
    margin-top:8mm; font-size:9.6pt;
  }
  .addressee{ color:var(--ink); }
  .addressee .co{ font-weight:600; }
  .date{ color:var(--muted); white-space:nowrap; }

  .greeting{ margin:6mm 0 0; font-weight:600; color:var(--ink); }
  p.body-text{ margin:3.6mm 0 0; }

  .techlist{ margin:4mm 0 0; padding:0; list-style:none; }
  /* In-flow marker, no position:relative — positioned text is written last
     in a Chrome PDF, so stream-order parsers would read these items late. */
  .techlist li{ margin-bottom:1.6mm; padding-left:4mm; text-indent:-4mm; }
  .techlist li::before{
    content:""; display:inline-block; vertical-align:middle;
    width:3px; height:3px; border-radius:50%; background:var(--accent);
    margin-right:calc(4mm - 3px);
  }
  .techlist b{ color:var(--ink); font-weight:600; }

  .links{ margin:5mm 0 0; font-size:9.6pt; }
  /* Both links on one line, separated like the contact line. */
  .links span.item{ white-space:nowrap; }
  .links .sep{ color:var(--rule); margin:0 .5em; }
  .links .lbl{ color:var(--muted); }
  .links a{ color:var(--accent); text-decoration:none; }
  .links a:hover{ text-decoration:underline; }

  .signoff{ margin-top:6mm; }
  .signoff .close{ color:var(--ink); }
  .signoff .name{ margin-top:3mm; font-size:12.5pt; font-weight:600; color:var(--ink); }

  noscript .fallback{
    margin:18px auto; padding:14px 16px; max-width:200mm;
    background:#fff4d6; border:1px solid #e0c266; font-size:13px;
  }

  /* Margins on the page, not the sheet, so they hold on every page. */
  @page{ size:A4; margin:14mm 16mm 13mm; }
  @media print{
    html, body{ background:#fff; }
    .toolbar{ display:none !important; }
    .sheet{ width:auto; margin:0; padding:0; box-shadow:none; }
    a{ color:inherit !important; }
    body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    p{ orphans:3; widows:3; }
  }
  @media screen and (max-width:800px){
    .sheet{ width:auto; margin:10px; padding:20px; }
    .meta-row{ flex-direction:column; gap:4mm; }
    h1{ font-size:21pt; }
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <strong>Ahmetcan Aksu — Cover Letter</strong>
  <button id="btn-en" aria-pressed="true">EN</button>
  <button id="btn-tr" aria-pressed="false">TR</button>
  <button id="btn-smaller" title="Shrink type">A&minus;</button>
  <span class="hint" id="fs-readout"></span>
  <button id="btn-bigger" title="Grow type">A+</button>
  <button id="btn-print">Save as PDF</button>
  <button id="btn-bake">Export static HTML</button>
  <span class="hint">A4 · margins “Default” · background graphics ON</span>
</div>

<noscript>
  <div class="fallback">
    <b>JavaScript is disabled.</b> This letter renders from a single data block
    so both languages stay in sync. Enable JavaScript, or use the static copy
    exported with “Export static HTML”.
  </div>
</noscript>

<main class="sheet" id="sheet"></main>

<script>
/* ==========================================================================
   LETTER DATA
   ========================================================================== */

const DATA = {

  layout: { baseFontPt: 10.4 },

  /* ================== APPLICATION — EDIT THIS PER APPLICATION ==============
     Leave a field as "" and the letter falls back to generic wording.
     ====================================================================== */
  application: {
    company:   "",
    role:      "",
    recipient: "",

    /* Where you found the role, e.g. "your careers page", "LinkedIn".
       Only used when company is filled in. */
    source:    "",

    /* ONE paragraph, in your own words, on why this company specifically.
       This is the part a hiring manager actually reads. */
    custom: {
      en: "",
      tr: ""
    },

    /* null = today's date. Or pin it: "2026-09-03" */
    date: null
  },

  /* ---------------------------------------------------------------- header */
  name: "Ahmetcan Aksu",
  role:    { en: "Software Developer — Backend, Fintech & AI",
             tr: "Yazılım Geliştirici — Backend, Fintek & Yapay Zeka" },

  contact: {
    email:    "hello@ahmetcanaksu.com",
    site:     "ahmetcanaksu.com",
    github:   "github.com/ahmetcanaksu",
    org:      "github.com/behemehal",
    linkedin: "linkedin.com/in/ahmetcanaksu",
    location: { en: "Istanbul, Türkiye", tr: "İstanbul, Türkiye" },
    phone: "(+90) 553 363 5308",
    showPhone: true          /* letters normally carry a phone number */
  },

  /* ---------------------------------------------------------------- body
     Kept in step with cv.html: every claim here is one the CV makes. The
     letter's job is the story the CV can't tell — fintech, AI, and the
     systems work underneath — in four short paragraphs. */

  /* Opening paragraph, in two variants. When the application block supplies a
     role, the letter opens with "I am writing to apply for..." and uses
     introAfterRole, which drops the redundant "My name is" — the letterhead
     already carries it. With no role filled in, plain intro is used. */
  introAfterRole: {
    en: "I am a software developer in Istanbul with 4+ years of professional experience building backend systems end to end, and my work sits where three things meet: fintech, AI, and the algorithms and systems underneath them.",
    tr: "İstanbul'da, backend sistemlerini uçtan uca geliştirmede 4+ yıllık profesyonel deneyime sahip bir yazılım geliştiriciyim; çalışmalarım üç alanın kesişiminde: fintek, yapay zeka ve bunların altındaki algoritmalar ve sistemler."
  },

  intro: {
    en: "My name is Ahmetcan Aksu, a software developer in Istanbul with 4+ years of professional experience building backend systems end to end. My work sits where three things meet: fintech, AI, and the algorithms and systems underneath them.",
    tr: "Ben Ahmetcan Aksu; İstanbul'da, backend sistemlerini uçtan uca geliştirmede 4+ yıllık profesyonel deneyime sahip bir yazılım geliştiriciyim. Çalışmalarım üç alanın kesişiminde: fintek, yapay zeka ve bunların altındaki algoritmalar ve sistemler."
  },

  /* second paragraph — fintech */
  experience: {
    en: "At Fonmap, an SPK-licensed fund investment platform with 100,000+ Google Play downloads, I took the backend from pre-production to go-live and owned its TEFAS order infrastructure end to end in .NET: order submission, status tracking, cancellation and blockage release as fault-tolerant background jobs. I also built the custodian-bank integration (account opening, document signing, transfers), the KYC and AML checks, and chain transactions that rebalance a portfolio in a single request.",
    tr: "SPK lisanslı, Google Play'de 100.000+ indirmeye ulaşan fon yatırım platformu Fonmap'te backend'i ön üretimden canlıya taşıdım ve TEFAS emir altyapısını .NET ile uçtan uca geliştirdim: emir iletimi, durum takibi, iptal ve blokaj çözme süreçlerini hataya dayanıklı arka plan işleri olarak kurdum. Ayrıca saklamacı banka entegrasyonunu (hesap açılışı, belge imzalama, transferler), KYC ve AML kontrollerini ve bir portföyü tek talepte yeniden dengeleyen zincir işlemleri geliştirdim."
  },

  /* third paragraph — AI, and the systems work underneath */
  ai: {
    en: "On the AI side, I integrated AI-driven portfolio recommendations and fund risk evaluations into Fonmap's investment flow, and I build LLM agents of my own: AI Sprite Studio, where a model draws and animates pixel art through 16 undoable tools, tuned for token economy on local 8B models; and AIStudio, an agent that writes animated video frames and renders them to MP4 with narration. Underneath both is a systems background: I designed Ellie, a type-safe programming language and bytecode VM in Rust for embedded targets.",
    tr: "Yapay zeka tarafında, yapay zeka destekli portföy önerilerini ve fon risk değerlendirmelerini Fonmap'in yatırım akışına entegre ettim; kendi LLM ajanlarımı da geliştiriyorum: bir modelin 16 geri alınabilir araçla piksel sanat çizip canlandırdığı, yerel 8B modellerde token tasarrufu için optimize ettiğim AI Sprite Studio ve animasyonlu video kareleri yazıp bunları seslendirmeyle MP4'e dönüştüren AIStudio. İkisinin temelinde sistem programlama var: gömülü hedefler için Rust ile tip güvenli bir programlama dili ve bytecode sanal makinesi olan Ellie'yi tasarladım."
  },

  tech: [
    { label: { en: "Fintech & backend", tr: "Fintek & backend" },
      value: { en: "C# / .NET, EF Core, Hangfire, Node.js, TypeScript, MSSQL, Redis, Elasticsearch; TEFAS, banking and capital-markets integrations",
               tr: "C# / .NET, EF Core, Hangfire, Node.js, TypeScript, MSSQL, Redis, Elasticsearch; TEFAS, bankacılık ve sermaye piyasası entegrasyonları" } },
    { label: { en: "AI & LLMs", tr: "Yapay zeka & LLM" },
      value: { en: "LLM agents & tool calling, Claude API, OpenAI-compatible APIs (Groq, LM Studio), local models (Qwen3-VL, Gemma), vision models",
               tr: "LLM ajanları & tool calling, Claude API, OpenAI uyumlu API'ler (Groq, LM Studio), yerel modeller (Qwen3-VL, Gemma), görüntü modelleri" } },
    { label: { en: "Systems", tr: "Sistem" },
      value: { en: "Rust, algorithm design, compiler and bytecode VM design, embedded (ARM, ESP32)",
               tr: "Rust, algoritma tasarımı, derleyici ve bytecode VM tasarımı, gömülü sistemler (ARM, ESP32)" } }
  ],

  /* closing paragraph */
  closing: {
    en: "Each of my projects has an introduction page at ahmetcanaksu.com, and I am happy to demo the AI work live. Thank you for your time; I look forward to hearing from you.",
    tr: "Her projemin ahmetcanaksu.com'da bir tanıtım sayfası var; yapay zeka çalışmalarımı canlı olarak göstermekten memnuniyet duyarım. Vakit ayırdığınız için teşekkür eder, sizden haber almayı umarım."
  },

  /* --------------------------------------------------------------- labels */
  labels: {
    genericGreeting: { en: "To Whom It May Concern,", tr: "İlgili Makama," },
    namedGreeting:   { en: "Dear ",                   tr: "Sayın " },
    signOff:         { en: "Best regards,",           tr: "Saygılarımla," },
    githubLabel:     { en: "GitHub",                  tr: "GitHub" },
    portfolioLabel:  { en: "Projects",                tr: "Projeler" },
    cvLabel:         { en: "CV",                      tr: "CV" },

    /* role sentence, appended to the intro when role/company are filled in.
       {role} and {company} are replaced. */
    roleSentence: {
      en: "I am writing to apply for the {role} position at {company}.",
      tr: "{company} bünyesindeki {role} pozisyonu için başvuruyorum."
    },
    roleSentenceNoCompany: {
      en: "I am writing to apply for the {role} position.",
      tr: "{role} pozisyonu için başvuruyorum."
    },
    sourceClause: {
      en: " I came across the role on {source}.",
      tr: " Pozisyonu {source} üzerinden gördüm."
    }
  }
};

/* ==========================================================================
   RENDERING  —  no need to edit below this line
   ========================================================================== */

const MONTHS_LONG = {
  en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
  tr: ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"]
};

let LANG = "en";
let FS = 10.4;

const t = (v) => {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[LANG] ?? v.en ?? "";
};
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const href = (u) => /^https?:/.test(u) ? u : "https://" + u;

function fmtToday(pin){
  const d = pin ? new Date(pin + "T12:00:00") : new Date();
  const day = d.getDate(), mon = MONTHS_LONG[LANG][d.getMonth()], yr = d.getFullYear();
  return LANG === "tr" ? `${day} ${mon} ${yr}` : `${day} ${mon} ${yr}`;
}

function renderHeader(){
  const c = DATA.contact;
  /* One line under the name, in reading order, as in cv.html: a contact
     column floated beside the name is read by parsers as a separate block. */
  const items = [
    esc(t(c.location)),
    c.showPhone ? esc(c.phone) : "",
    `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
    `<a href="${esc(href(c.linkedin))}">${esc(c.linkedin)}</a>`,
    `<a href="${esc(href(c.site))}">${esc(c.site)}</a>`
  ].filter(Boolean)
   .map(item => `<span class="ci">${item}</span>`)
   .join(' <span class="sep">|</span> ');

  return `<header class="masthead">
    <h1>${esc(DATA.name)}</h1>
    <div class="role">${esc(t(DATA.role))}</div>
    <p class="contact">${items}</p>
  </header>`;
}

function renderMetaRow(){
  const a = DATA.application;
  const lines = [];
  if (a.recipient) lines.push(esc(a.recipient));
  if (a.company)   lines.push(`<span class="co">${esc(a.company)}</span>`);
  return `<div class="meta-row">
    <div class="addressee">${lines.join("<br>")}</div>
    <div class="date">${esc(fmtToday(a.date))}</div>
  </div>`;
}

function renderGreeting(){
  const a = DATA.application;
  const text = a.recipient
    ? t(DATA.labels.namedGreeting) + a.recipient + ","
    : t(DATA.labels.genericGreeting);
  return `<p class="greeting">${esc(text)}</p>`;
}

/* the role sentence only appears once you fill in the application block */
function roleSentence(){
  const a = DATA.application;
  if (!a.role) return "";
  const tpl = a.company ? t(DATA.labels.roleSentence) : t(DATA.labels.roleSentenceNoCompany);
  let s = tpl.replace("{role}", a.role).replace("{company}", a.company)
             .replace(/\.\.(\s|$)/g, ".$1"); /* "Acme Ltd." + "." -> one period */
  if (a.company && a.source) s += t(DATA.labels.sourceClause).replace("{source}", a.source);
  return esc(s) + " ";
}

function renderTech(){
  return `<ul class="techlist">${DATA.tech.map(r =>
      `<li><b>${esc(t(r.label))}:</b> ${esc(t(r.value))}</li>`).join("")}</ul>`;
}

function renderLinks(){
  const c = DATA.contact, l = DATA.labels;
  return `<div class="links">
    <span class="item"><span class="lbl">${esc(t(l.portfolioLabel))}:</span> <a href="${esc(href(c.site + (LANG === "tr" ? "/tr/#/projects" : "/#/projects")))}">${esc(c.site + "/projects")}</a></span>
    <span class="sep">|</span>
    <span class="item"><span class="lbl">${esc(t(l.githubLabel))}:</span> <a href="${esc(href(c.github))}">${esc(c.github)}</a></span>
  </div>`;
}

function renderCustom(){
  const c = t(DATA.application.custom);
  return c ? `<p class="body-text">${esc(c)}</p>` : "";
}

function setFontSize(pt){
  FS = Math.min(13, Math.max(8, Math.round(pt * 10) / 10));
  document.documentElement.style.setProperty("--fs", FS + "pt");
  const out = document.getElementById("fs-readout");
  if (out) out.textContent = FS.toFixed(1) + "pt";
  try { localStorage.setItem("letter-fs", String(FS)); } catch (e) {}
}

function render(){
  document.documentElement.lang = LANG;
  const co = DATA.application.company;
  document.title = co
    ? `${DATA.name} — Cover Letter — ${co}`
    : `${DATA.name} — Cover Letter`;

  document.getElementById("sheet").innerHTML =
    renderHeader() +
    renderMetaRow() +
    renderGreeting() +
    `<p class="body-text">${(() => {
        const lead = roleSentence();
        return lead + esc(t(lead ? DATA.introAfterRole : DATA.intro));
      })()}</p>` +
    `<p class="body-text">${esc(t(DATA.experience))}</p>` +
    `<p class="body-text">${esc(t(DATA.ai))}</p>` +
    renderTech() +
    renderCustom() +
    `<p class="body-text">${esc(t(DATA.closing))}</p>` +
    renderLinks() +
    `<div class="signoff">
       <div class="close">${esc(t(DATA.labels.signOff))}</div>
       <div class="name">${esc(DATA.name)}</div>
     </div>`;

  document.getElementById("btn-en").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("btn-tr").setAttribute("aria-pressed", String(LANG === "tr"));
}

function setLang(lang, updateHash){
  LANG = (lang === "tr") ? "tr" : "en";
  try { localStorage.setItem("letter-lang", LANG); } catch (e) {}
  if (updateHash) history.replaceState(null, "", LANG === "tr" ? "#tr" : "#en");
  render();
}

function exportStatic(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll('.toolbar, noscript, script:not([type="application/ld+json"])')
       .forEach(n => n.remove());
  const co = DATA.application.company
    ? "-" + DATA.application.company.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "")
    : "";
  const blob = new Blob(["<!doctype html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Ahmetcan-Aksu-Cover-Letter-${LANG.toUpperCase()}${co}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

(function init(){
  const hash = location.hash.replace("#", "").toLowerCase();
  const qs = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("letter-lang"); } catch (e) {}
  setLang(hash || qs || saved || "en", false);

  let savedFs = null;
  try { savedFs = parseFloat(localStorage.getItem("letter-fs")); } catch (e) {}
  setFontSize(Number.isFinite(savedFs) ? savedFs : (DATA.layout && DATA.layout.baseFontPt) || 10.4);

  document.getElementById("btn-en").onclick = () => setLang("en", true);
  document.getElementById("btn-tr").onclick = () => setLang("tr", true);
  document.getElementById("btn-smaller").onclick = () => setFontSize(FS - 0.2);
  document.getElementById("btn-bigger").onclick  = () => setFontSize(FS + 0.2);
  document.getElementById("btn-print").onclick = () => window.print();
  document.getElementById("btn-bake").onclick = exportStatic;
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "").toLowerCase();
    if (h === "en" || h === "tr") setLang(h, false);
  });
})();
</script>
</body>
</html>
