<style>
  :root{
    color-scheme: light;

    --fs:       10.4pt;
    --ink:      #14181f;
    --ink-soft: #303845;
    --muted:    #5c6675;

    color: var(--ink-soft);
    -webkit-font-smoothing: antialiased;

  }

  .toolbar{
    position: sticky; top:0; z-index:10;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px 14px;
    background:#1b2027; color:#e8ebf0;
    font-size:12px;
  }
  .toolbar strong{ font-weight:600; margin-right:auto; letter-spacing:.02em; }
  .toolbar button{
    font:inherit; font-weight:500;
    padding:6px 12px; border-radius:6px; cursor:pointer;
    border:1px solid #3c4553; background:#2a313b; color:#e8ebf0;
  }
  .toolbar button:hover{ background:#343d49; }
  .toolbar button[aria-pressed="true"]{ background:#dfe4ec; color:#1b2027; border-color:#dfe4ec; }
  .toolbar .hint{ color:#98a2b3; font-size:11px; }

  /* ---------- the sheet ---------- */
  .sheet{
    width: 210mm;
    margin: 18px auto 40px;
    padding: 15mm 16mm;
    background:#fff;
    box-shadow: 0 1px 3px rgba(20,24,31,.14), 0 10px 34px rgba(20,24,31,.10);
  }

  /* ---------- header ---------- */
  header.masthead{

    padding-bottom: 7px;
    border-bottom: 2px solid var(--accent);
  }
  h1{

    font-size: 25pt; line-height:1.03; font-weight:700;
    letter-spacing:-.015em; color: var(--ink);
  }
  .role{
    margin-top: 4px;
    font-size: 10.2pt; font-weight:600; color: var(--accent);
    letter-spacing:.055em; text-transform: uppercase;
  }
  .tagline{ margin-top:3px; font-size:9.2pt; color: var(--muted); }

  .contact{
    flex: 0 0 auto;
    text-align: right;
    font-size: 8.9pt; line-height:1.6; color: var(--ink-soft);
  }
  .contact a{ color: var(--ink-soft); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
  .contact .lbl{ color: var(--muted); }

  /* ---------- sections ---------- */
  section{ margin-top: 11px; }
  h2{
    margin:0 0 7px;
    font-size: 9.3pt; font-weight:700; color: var(--accent);
    letter-spacing:.10em; text-transform: uppercase;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--rule);
    break-after: avoid; page-break-after: avoid;
  }

  .summary{ margin:0; font-size:10.1pt; }

  /* ---------- entries ---------- */
  .entry{ margin-bottom: 9px; }
  .entry:last-child{ margin-bottom:0; }
  .entry-head{ break-after: avoid; page-break-after: avoid; }
  .entry-line{
    display:flex; align-items:baseline; justify-content:space-between; gap:8mm;
  }
  .entry-title{ font-size:10.6pt; font-weight:700; color: var(--ink); }
  .entry-org{ font-weight:600; color: var(--accent); }
  .entry-meta{
    flex:0 0 auto; font-size:8.9pt; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space:nowrap;
  }
  .entry-sub{ font-size:9.1pt; color: var(--muted); margin-top:1px; }

  ul{ margin: 4px 0 0; padding-left: 15px; }
  li{ margin-bottom: 2px; break-inside: avoid; page-break-inside: avoid; }
  li::marker{ color: var(--rule); }

  .stack{
    margin-top: 3px; font-size: 9.1pt; color: var(--muted);
  }
  .stack b{ color: var(--ink-soft); font-weight:600; }

  /* ---------- skills ---------- */
  .skills{ display:grid; grid-template-columns: 30mm 1fr; gap: 3px 8px; font-size:9.7pt; }
  .skills dt{ font-weight:600; color: var(--ink); }
  .skills dd{ margin:0; }

  /* ---------- compact two-up blocks ---------- */
  .two-up{ display:grid; grid-template-columns: 1fr 1fr; gap: 4px 12mm; }
  .two-up > *{ break-inside: avoid; page-break-inside: avoid; }
  .flat{ list-style:none; margin:0; padding:0; font-size:9.7pt; }
  .flat li{ margin-bottom:2.5px; padding-left:9px; position:relative; }
  .flat li::before{
    content:""; position:absolute; left:0; top:.52em;
    width:3px; height:3px; border-radius:50%; background: var(--rule);
  }
  .ref-name{ font-weight:600; color: var(--ink); }
  .note{ font-size:8.8pt; color: var(--muted); margin: 5px 0 0; }

  .proj, .edu-item{ break-inside: avoid; page-break-inside: avoid; }

  /* two sections sharing one row, to keep the CV on a round page count */
  .pair{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 12mm; margin-top: 11px; }
  .pair > section{ margin-top: 0; }
  a.plain{ color: var(--accent); text-decoration:none; }
  a.plain:hover{ text-decoration:underline; }

  noscript .fallback{
    margin: 18px auto; padding:14px 16px; max-width:200mm;
    background:#fff4d6; border:1px solid #e0c266; font-size:13px;
  }

  /* ---------- print ---------- */
  @page{ size: A4; margin: 0; }

  @media print{
    html, body{ background:#fff; }
    .toolbar{ display:none !important; }
    .sheet{
      width: auto; margin:0;
      padding: 13mm 14mm 12mm;
      box-shadow:none;
    }
    a{ color: inherit !important; }
    body{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    p, li{ orphans:3; widows:3; }
    section{ break-inside: auto; }
  }

  @media screen and (max-width: 800px){
    .sheet{ width:auto; margin:10px; padding:20px; }
    header.masthead{ flex-direction:column; align-items:flex-start; gap:10px; }
    .contact{ text-align:left; }
    .skills{ grid-template-columns: 1fr; }
    .skills dt{ margin-top:5px; }
    .two-up{ grid-template-columns: 1fr; }
    .pair{ grid-template-columns: 1fr; gap: 11px; }
    h1{ font-size:22pt; }
  }

    skills:       { en: "Technical Skills",           tr: "Teknik Yetenekler" },
    education:    { en: "Education",                  tr: "Eğitim" },
    certificates: { en: "Certificates",               tr: "Sertifikalar" },
    languages:    { en: "Languages",                  tr: "Diller" },
    references:   { en: "References",                 tr: "Referanslar" },
    refsNote:     { en: "Contact details available on request.",
                    tr: "İletişim bilgileri talep üzerine paylaşılır." },
    stack:        { en: "Stack",                      tr: "Teknolojiler" },
    present:      { en: "Present",                    tr: "Devam Ediyor" }
  }
};

/* ==========================================================================
   RENDERING  —  no need to edit below this line
   ========================================================================== */

const MONTHS = {
  en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
  tr: ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"]
};

let LANG = "en";
let FS = 10.2;

/* pick the localised value out of {en,tr}, or pass plain strings through */
const t = (v) => {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[LANG] ?? v.en ?? "";
};

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* "2024-02" -> "Feb 2024" | "2022" -> "2022" | null -> "Present" */
function fmtDate(v){
  if (!v) return t(DATA.labels.present);
  const [y, m] = String(v).split("-");
  return m ? `${MONTHS[LANG][Number(m) - 1]} ${y}` : y;
}
function fmtRange(from, to){
  const a = from ? fmtDate(from) : "";
  const b = fmtDate(to);
  return a ? `${a} – ${b}` : b;
}
const href = (u) => /^https?:/.test(u) ? u : "https://" + u;

function bullets(list){
  const items = (list && (list[LANG] || list.en)) || [];
  if (!items.length) return "";
  return `<ul>${items.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`;
}

function renderHeader(){
  const c = DATA.contact;
  const rows = [
    `<div><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`,
    c.showPhone ? `<div>${esc(c.phone)}</div>` : "",
    `<div><a href="${esc(href(c.site))}">${esc(c.site)}</a></div>`,
    `<div><a href="${esc(href(c.linkedin))}">${esc(c.linkedin)}</a></div>`,
    `<div><a href="${esc(href(c.github))}">${esc(c.github)}</a></div>`,
    `<div><span class="lbl">org</span> <a href="${esc(href(c.org))}">${esc(c.org)}</a></div>`,
    `<div>${esc(t(c.location))}</div>`
  ].filter(Boolean).join("");

  return `<header class="masthead">
    <div>
      <h1>${esc(DATA.name)}</h1>
      <div class="role">${esc(t(DATA.role))}</div>
      <div class="tagline">${esc(t(DATA.tagline))}</div>
    </div>
    <div class="contact">${rows}</div>
  </header>`;
}

function section(title, inner){
  return `<section><h2>${esc(title)}</h2>${inner}</section>`;
}

function renderExperience(){
  const inner = DATA.experience.map(j => `
    <article class="entry">
      <div class="entry-head">
        <div class="entry-line">
          <div class="entry-title">${esc(t(j.title))} · <span class="entry-org">${esc(t(j.org))}</span></div>
          <div class="entry-meta">${esc(fmtRange(j.from, j.to))}${j.place ? " · " + esc(t(j.place)) : ""}</div>
        </div>
      </div>
      ${bullets(j.bullets)}
      ${j.stack ? `<div class="stack"><b>${esc(t(DATA.labels.stack))}:</b> ${esc(t(j.stack))}</div>` : ""}
    </article>`).join("");
  return section(t(DATA.labels.experience), inner);
}

function renderProjects(){
  const inner = DATA.projects.map(p => `
    <article class="entry proj">
      <div class="entry-head">
        <div class="entry-line">
          <div class="entry-title">${esc(t(p.title))}</div>
          ${p.meta ? `<div class="entry-meta">${esc(t(p.meta))}</div>` : ""}
        </div>
        ${p.link ? `<div class="entry-sub">${p.link.split(" · ").map(u =>
            `<a class="plain" href="${esc(href(u))}">${esc(u)}</a>`).join(" · ")}</div>` : ""}
      </div>
      ${bullets(p.bullets)}
    </article>`).join("");
  return section(t(DATA.labels.projects), inner);
}

function renderSkills(){
  const inner = `<dl class="skills">${DATA.skills.map(s =>
    `<dt>${esc(t(s.label))}</dt><dd>${esc(t(s.value))}</dd>`).join("")}</dl>`;
  return section(t(DATA.labels.skills), inner);
}

function renderEducation(){
  const inner = DATA.education.map(e => `
    <div class="entry edu-item">
      <div class="entry-line">
        <div class="entry-title">${esc(t(e.degree))}</div>
        <div class="entry-meta">${esc(fmtRange(e.from, e.to))}</div>
      </div>
      <div class="entry-sub">${esc(t(e.school))}${e.note ? " · " + esc(t(e.note)) : ""}</div>
    </div>`).join("");
  return section(t(DATA.labels.education), inner);
}

function renderCertificates(){
  const inner = `<ul class="flat two-up">${DATA.certificates.map(c =>
    `<li>${esc(t(c))}</li>`).join("")}</ul>`;
  return section(t(DATA.labels.certificates), inner);
}

function renderLanguages(){
  const inner = `<ul class="flat">${DATA.languages.map(l =>
    `<li><span class="ref-name">${esc(t(l.name))}</span> — ${esc(t(l.level))}</li>`).join("")}</ul>`;
  return section(t(DATA.labels.languages), inner);
}

function renderReferences(){
  const inner = `<ul class="flat">${DATA.references.map(r =>
      `<li><span class="ref-name">${esc(r.name)}</span> — ${esc(t(r.org))}</li>`).join("")}</ul>
    <p class="note">${esc(t(DATA.labels.refsNote))}</p>`;
  return section(t(DATA.labels.references), inner);
}

/* structured data, so CV-parsing tools and LLMs get unambiguous fields */
function renderJsonLd(){
  const c = DATA.contact;
  const current = DATA.experience.find(j => j.to === null);
  const person = {
    "@context": "https://schema.org",
    "@type": "Person",
    name: DATA.name,
    jobTitle: t(DATA.role),
    description: t(DATA.summary),
    email: "mailto:" + c.email,
    url: href(c.site),
    address: { "@type": "PostalAddress", addressLocality: "Istanbul", addressCountry: "TR" },
    sameAs: [href(c.github), href(c.linkedin), href(c.org)],
    knowsAbout: DATA.skills.flatMap(s => t(s.value).split(", ")),
    knowsLanguage: DATA.languages.map(l => ({ "@type": "Language", name: t(l.name), alternateName: l.code })),
    alumniOf: DATA.education.map(e => ({ "@type": "EducationalOrganization", name: t(e.school) })),
    hasCredential: DATA.certificates.map(x => ({
      "@type": "EducationalOccupationalCredential", name: t(x)
    }))
  };
  if (c.showPhone) person.telephone = c.phone;
  if (current) person.worksFor = { "@type": "Organization", name: t(current.org) };

  let el = document.getElementById("ld");
  if (!el) {
    el = document.createElement("script");
    el.type = "application/ld+json";
    el.id = "ld";
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(person, null, 2);
}

function setFontSize(pt){
  FS = Math.min(13, Math.max(8, Math.round(pt * 10) / 10));
  document.documentElement.style.setProperty("--fs", FS + "pt");
  const out = document.getElementById("fs-readout");
  if (out) out.textContent = FS.toFixed(1) + "pt";
  try { localStorage.setItem("cv-fs", String(FS)); } catch (e) {}
}

function render(){
  document.documentElement.lang = LANG;
  document.title = `${DATA.name} — ${t(DATA.role)} — CV`;
  document.getElementById("sheet").innerHTML =
    renderHeader() +
    section(t(DATA.labels.summary), `<p class="summary">${esc(t(DATA.summary))}</p>`) +
    renderExperience() +
    renderProjects() +
    renderSkills() +
    renderEducation() +
    renderCertificates() +
    `<div class="pair">${renderLanguages()}${renderReferences()}</div>`;
  renderJsonLd();

  document.getElementById("btn-en").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("btn-tr").setAttribute("aria-pressed", String(LANG === "tr"));
}

function setLang(lang, updateHash){
  LANG = (lang === "tr") ? "tr" : "en";
  try { localStorage.setItem("cv-lang", LANG); } catch (e) {}
  if (updateHash) history.replaceState(null, "", LANG === "tr" ? "#tr" : "#en");
  render();
}

/* bake the rendered DOM into a script-free HTML file */
function exportStatic(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll('.toolbar, noscript, script:not([type="application/ld+json"])')
       .forEach(n => n.remove());
  const blob = new Blob(["<!doctype html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Ahmetcan-Aksu-CV-${LANG.toUpperCase()}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* initial language: URL hash > ?lang= > saved choice > en */
(function init(){
  const hash = location.hash.replace("#", "").toLowerCase();
  const qs = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("cv-lang"); } catch (e) {}
  setLang(hash || qs || saved || "en", false);

  document.getElementById("btn-en").onclick = () => setLang("en", true);
  document.getElementById("btn-tr").onclick = () => setLang("tr", true);
  let savedFs = null;
  try { savedFs = parseFloat(localStorage.getItem("cv-fs")); } catch (e) {}
  setFontSize(Number.isFinite(savedFs) ? savedFs : (DATA.layout && DATA.layout.baseFontPt) || 10.4);

  document.getElementById("btn-smaller").onclick = () => setFontSize(FS - 0.2);
  document.getElementById("btn-bigger").onclick  = () => setFontSize(FS + 0.2);
  document.getElementById("btn-print").onclick = () => window.print();
  document.getElementById("btn-bake").onclick = exportStatic;
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "").toLowerCase();
    if (h === "en" || h === "tr") setLang(h, false);
  });
})();
</script>
</body>
</html>
