  ============================================================================
  HOW TO USE THIS FILE

  2. Edit content ONLY inside the CV DATA block below (search: "CV DATA").
     Every text field holds both languages: { en: "...", tr: "..." }
  3. Export PDF:  Cmd/Ctrl + P  ->  Destination "Save as PDF"
                  Paper A4  ·  Margins "Default"  ·  Scale 100%
                  Background graphics: ON (keeps the accent rules)
     The page is laid out for A4 and already includes its own print margins.
  4. Language: the EN / TR button, or open cv.html#tr  (choice is remembered)
  5. Too many pages? Press A- (or set layout.baseFontPt lower in CV DATA).
     The type size you pick is remembered and used by the PDF export.
  6. "Export static HTML" button bakes the current language into a plain HTML
     file with no JavaScript — use that if an application portal asks for an
     HTML upload, since some parsers do not run scripts.
  ============================================================================
-->

<style>
  :root{
    color-scheme: light;
    /* base type size — the single lever for fitting content onto N pages.
       Set it in the CV DATA block (layout.baseFontPt) or nudge it with the
       A- / A+ buttons on screen until the page count looks right. */
    --fs:       10.4pt;
    --ink:      #14181f;
    --ink-soft: #303845;
    --muted:    #5c6675;
    --accent:   #2f5fbf;
    --rule:     #c9d2e0;
    --rule-soft:#e4e9f1;
  }

  *{ box-sizing: border-box; }

  html{ background:#eceef2; }

  body{
    margin:0;
    /* Arial on purpose: résumé parsers (ATS) read the PDF, not the page.
       System UI fonts (San Francisco, Segoe UI Variable, Inter variable) are
       variable fonts, which Chrome embeds in a PDF as Type 3 — and several ATS
       parsers extract Type 3 text as garbage or nothing. Arial embeds as plain
       TrueType on every OS. Liberation Sans is its metric twin on Linux. */
    font-family: Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
    /* No ligatures: an "fi" ligature is extracted as the single glyph "ﬁ",
       and "proﬁle" doesn't match the keyword "profile". */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0;
    font-size: var(--fs);
    line-height: 1.42;
    color: var(--ink-soft);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- screen chrome (never printed) ---------- */
  .toolbar{
    position: sticky; top:0; z-index:10;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px 14px;
    background:#1b2027; color:#e8ebf0;
    font-size:12px;
  }
  .toolbar strong{ font-weight:600; margin-right:auto; letter-spacing:.02em; }
  .toolbar button{
    font:inherit; font-weight:500;
    padding:6px 12px; border-radius:6px; cursor:pointer;
    border:1px solid #3c4553; background:#2a313b; color:#e8ebf0;
  }
  .toolbar button:hover{ background:#343d49; }
  .toolbar button[aria-pressed="true"]{ background:#dfe4ec; color:#1b2027; border-color:#dfe4ec; }
  .toolbar .hint{ color:#98a2b3; font-size:11px; }

  /* ---------- the sheet ---------- */
  .sheet{
    width: 210mm;
    margin: 18px auto 40px;
    padding: 15mm 16mm;
    background:#fff;
    box-shadow: 0 1px 3px rgba(20,24,31,.14), 0 10px 34px rgba(20,24,31,.10);
  }

  /* ---------- header ---------- */
  /* One column on purpose. A contact block floated to the right of the name is
     read by ATS parsers as a separate column, and in testing came out after the
     Summary heading — detached from the name it belongs to. */
  header.masthead{
    padding-bottom: 7px;
    border-bottom: 2px solid var(--accent);
  }
  h1{
    margin:0;
    font-size: 25pt; line-height:1.03; font-weight:700;
    letter-spacing:-.015em; color: var(--ink);
  }
  .role{
    margin-top: 4px;
    font-size: 10.2pt; font-weight:600; color: var(--accent);
    letter-spacing:.055em; text-transform: uppercase;
  }
  .tagline{ margin-top:3px; font-size:9.2pt; color: var(--muted); }

  .contact{
    margin: 6px 0 0;
    font-size: 8.9pt; line-height:1.55; color: var(--ink-soft);
  }
  .contact a{ color: var(--ink-soft); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
  .contact .sep{ color: var(--rule); margin: 0 .1em; }
  .contact .ci{ white-space: nowrap; }

  /* ---------- sections ---------- */
  section{ margin-top: 11px; }
  h2{
    margin:0 0 7px;
    font-size: 9.3pt; font-weight:700; color: var(--accent);
    letter-spacing:.10em; text-transform: uppercase;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--rule);
    break-after: avoid; page-break-after: avoid;
  }

  .summary{ margin:0; font-size:10.1pt; }

  /* bold lead phrases: the eye can skim just these */
  li b, .summary b{ color: var(--ink); font-weight:700; }

  /* ---------- entries ---------- */
  /* An entry never splits across pages: a job title on one page with half its
     bullets on the next reads as two jobs. Chrome still splits an entry that is
     taller than a whole page, so the long current role is safe. */
  .entry{ margin-bottom: 9px; break-inside: avoid; page-break-inside: avoid; }
  .entry:last-child{ margin-bottom:0; }
  .entry-head{ break-after: avoid; page-break-after: avoid; }
  .entry-line{
    display:flex; align-items:baseline; justify-content:space-between; gap:8mm;
  }
  .entry-title{ font-size:10.6pt; font-weight:700; color: var(--ink); }
  .entry-org{ font-weight:600; color: var(--accent); }
  .entry-meta{
    flex:0 0 auto; font-size:8.9pt; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space:nowrap;
  }
  .entry-sub{ font-size:9.1pt; color: var(--muted); margin-top:1px; }

  ul{ margin: 4px 0 0; padding-left: 15px; }
  li{ margin-bottom: 2px; break-inside: avoid; page-break-inside: avoid; }
  li::marker{ color: var(--rule); }

  .stack{
    margin-top: 3px; font-size: 9.1pt; color: var(--muted);
  }
  .stack b{ color: var(--ink-soft); font-weight:600; }

  /* ---------- skills ---------- */
  .skills{ display:grid; grid-template-columns: 34mm 1fr; gap: 3px 8px; font-size:9.7pt; }
  .skills dt{ font-weight:600; color: var(--ink); }
  .skills dd{ margin:0; }

  .flat{ list-style:none; margin:0; padding:0; font-size:9.7pt; }
  /* A small dot marker drawn in normal flow. No position:relative here:
     Chrome paints positioned elements in a later pass, which writes their text
     at the end of the PDF content stream — and stream-order parsers then read
     these items after everything else on the page. */
  .flat li{ margin-bottom:2.5px; padding-left:9px; text-indent:-9px; }
  .flat li::before{
    content:""; display:inline-block; vertical-align:middle;
    width:3px; height:3px; border-radius:50%; background: var(--rule);
    margin-right:6px;
  }
  .ref-name{ font-weight:600; color: var(--ink); }
  .langs{ margin:0; font-size:9.7pt; }
  .note{ font-size:8.8pt; color: var(--muted); margin: 5px 0 0; }

  /* Projects may split between bullets (each bullet and the entry heading
     still stay whole). Keeping a whole project together pushed it to page 2
     and left a 4cm hole at the bottom of page 1. */
  .edu-item{ break-inside: avoid; page-break-inside: avoid; }

  a.plain{ color: var(--accent); text-decoration:none; }
  a.plain:hover{ text-decoration:underline; }

  noscript .fallback{
    margin: 18px auto; padding:14px 16px; max-width:200mm;
    background:#fff4d6; border:1px solid #e0c266; font-size:13px;
  }

  /* ---------- print ---------- */
  /* The margins belong to the page, not the sheet: padding on .sheet is
     applied once to the whole document, so page 2 used to start 3mm from the
     top edge of the paper. */
  @page{ size: A4; margin: 11mm 14mm 10mm; }

  @media print{
    html, body{ background:#fff; }
    .toolbar{ display:none !important; }
    .sheet{
      width: auto; margin:0;
      padding: 0;
      box-shadow:none;
    }
    a{ color: inherit !important; }
    body{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    p, li{ orphans:3; widows:3; }
    section{ break-inside: auto; }
  }

  @media screen and (max-width: 800px){
    .sheet{ width:auto; margin:10px; padding:20px; }
    .skills{ grid-template-columns: 1fr; }
    .skills dt{ margin-top:5px; }
    h1{ font-size:22pt; }
  }
</style>

    { label: { en: "Databases",  tr: "Veritabanları" },
      value: "MSSQL, PostgreSQL, MongoDB, Redis, Elasticsearch, MinIO, Cloudflare R2" },
    { label: { en: "Infra & Tools", tr: "Altyapı & Araçlar" },
      value: "Docker, Nginx, Linux & Bash, GitHub Actions CI/CD, Cloudflare, AWS, Git, Puppeteer" },
    { label: { en: "Systems & Embedded", tr: "Sistem & Gömülü" },
      value: { en: "Algorithm design, compiler and bytecode VM design, ARM, ESP32/ESP8266, Arduino, Raspberry Pi, TCP/UDP, FFI",
               tr: "Algoritma tasarımı, derleyici ve bytecode VM tasarımı, ARM, ESP32/ESP8266, Arduino, Raspberry Pi, TCP/UDP, FFI" } }
  ],

  /* ------------------------------------------------------------- education */
  education: [
    { degree: { en: "BSc, Management Information Systems", tr: "Lisans, Yönetim Bilişim Sistemleri" },
      school: { en: "Anadolu University", tr: "Anadolu Üniversitesi" },
      from: "2024", to: null,
      note: null },
    { degree: { en: "Associate Degree, Computer Programming", tr: "Ön Lisans, Bilgisayar Programcılığı" },
      school: { en: "Işık University", tr: "Işık Üniversitesi" },
      from: null, to: "2022",
      note: { en: "GPA 3.53 / 4.00 · C, C++, C#, Java, JavaScript, MSSQL, HTML",
              tr: "GNO 3.53 / 4.00 · C, C++, C#, Java, JavaScript, MSSQL, HTML" } }
  ],

  /* ---------------------------------------------------------- certificates */
  /* The three that carry weight next to 4 years in fintech. Course
     certificates (BTK Academy, Patika.dev) read as entry-level here. */
  certificates: [
    { en: "EF SET English Certificate — C2", tr: "EF SET İngilizce Sertifikası — C2" },
    { en: "Turkish Capital Markets Association", tr: "Türkiye Sermaye Piyasaları Birliği" },
    { en: "Mobile App Development with Google Flutter", tr: "Google Flutter ile Mobil Uygulama Geliştirme" }
  ],

  /* ------------------------------------------------------------- languages */
  languages: [
    { name: { en: "Turkish", tr: "Türkçe" }, level: { en: "Native", tr: "Ana dil" }, code: "tr" },
    { name: { en: "English", tr: "İngilizce" }, level: { en: "Professional — C2 (EF SET certified)", tr: "Profesyonel — C2 (EF SET sertifikalı)" }, code: "en" }
  ],

  /* ------------------------------------------------------------ references
     Hidden for now (showReferences: false). Referees' contact details are not
     kept in this file at all: it is served publicly at
     ahmetcanaksu.com/cv/cv.html, and even an HTML comment is in the page
     source. Keep them somewhere private and share them on request. */
  showReferences: false,
  /* Empty while hidden: this file is public, so referees' names stay out of
     its source too. Fill in { name, org } entries and set showReferences. */
  references: [],

  /* ------------------------------------------ section headings & UI labels */
  labels: {
    summary:      { en: "Summary",                    tr: "Özet" },
    experience:   { en: "Experience",                 tr: "Deneyim" },
    projects:     { en: "Projects & Open Source",     tr: "Projeler & Açık Kaynak" },
    skills:       { en: "Technical Skills",           tr: "Teknik Yetenekler" },
    education:    { en: "Education",                  tr: "Eğitim" },
    certificates: { en: "Certificates",               tr: "Sertifikalar" },
    languages:    { en: "Languages",                  tr: "Diller" },
    spoken:       { en: "Spoken",                     tr: "Yabancı dil" },
    references:   { en: "References",                 tr: "Referanslar" },
    refsNote:     { en: "Contact details available on request.",
                    tr: "İletişim bilgileri talep üzerine paylaşılır." },
    stack:        { en: "Stack",                      tr: "Teknolojiler" },
    present:      { en: "Present",                    tr: "Devam Ediyor" }
  }
};

/* ==========================================================================
   RENDERING  —  no need to edit below this line
   ========================================================================== */

const MONTHS = {
  en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
  tr: ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"]
};

let LANG = "en";
let FS = 10.2;

/* pick the localised value out of {en,tr}, or pass plain strings through */
const t = (v) => {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[LANG] ?? v.en ?? "";
};

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* "2024-02" -> "Feb 2024" | "2022" -> "2022" | null -> "Present" */
function fmtDate(v){
  if (!v) return t(DATA.labels.present);
  const [y, m] = String(v).split("-");
  return m ? `${MONTHS[LANG][Number(m) - 1]} ${y}` : y;
}
function fmtRange(from, to){
  const a = from ? fmtDate(from) : "";
  const b = fmtDate(to);
  return a ? `${a} – ${b}` : b;
}
const href = (u) => /^https?:/.test(u) ? u : "https://" + u;

/* Escape, then turn **this** into <b>this</b>. Bold is plain text weight in
   the PDF, so parsers read it like any other word. */
const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const plain = (s) => String(s).replace(/\*\*(.+?)\*\*/g, "$1");

function bullets(list, cls){
  const items = (list && (list[LANG] || list.en)) || [];
  if (!items.length) return "";
  return `<ul${cls ? ` class="${cls}"` : ""}>${items.map(b => `<li>${rich(b)}</li>`).join("")}</ul>`;
}

function renderHeader(){
  const c = DATA.contact;
  /* One line of plain text in reading order, right under the name: location,
     email, phone, then links. Every link's visible text is the URL itself, so
     a parser that drops hyperlinks still gets the address. */
  const items = [
    esc(t(c.location)),
    `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
    c.showPhone ? esc(c.phone) : "",
    `<a href="${esc(href(c.linkedin))}">${esc(c.linkedin)}</a>`,
    `<a href="${esc(href(c.github))}">${esc(c.github)}</a>`,
    /* c.org (github.com/behemehal) is not repeated here: it is linked under
       Projects and listed in the JSON-LD, and it would wrap this line. */
    `<a href="${esc(href(c.site))}">${esc(c.site)}</a>`
  ].filter(Boolean)
   /* Each item is unbreakable and the separators carry real spaces, so the
      line wraps between items — never inside "Istanbul, Türkiye" or a URL. */
   .map(item => `<span class="ci">${item}</span>`)
   .join(' <span class="sep">|</span> ');

  return `<header class="masthead">
    <h1>${esc(DATA.name)}</h1>
    <div class="role">${esc(t(DATA.role))}</div>
    <div class="tagline">${esc(t(DATA.tagline))}</div>
    <p class="contact">${items}</p>
  </header>`;
}

function section(title, inner){
  return `<section><h2>${esc(title)}</h2>${inner}</section>`;
}

function renderExperience(){
  const inner = DATA.experience.map(j => `
    <article class="entry">
      <div class="entry-head">
        <div class="entry-line">
          <div class="entry-title">${esc(t(j.title))} · <span class="entry-org">${esc(t(j.org))}</span></div>
          <div class="entry-meta">${esc(fmtRange(j.from, j.to))}${j.place ? " · " + esc(t(j.place)) : ""}</div>
        </div>
      </div>
      ${bullets(j.bullets)}
      ${j.stack ? `<div class="stack"><b>${esc(t(DATA.labels.stack))}:</b> ${esc(t(j.stack))}</div>` : ""}
    </article>`).join("");
  return section(t(DATA.labels.experience), inner);
}

function renderProjects(){
  const inner = DATA.projects.map(p => `
    <article class="entry proj">
      <div class="entry-head">
        <div class="entry-line">
          <div class="entry-title">${esc(t(p.title))}</div>
          ${p.meta ? `<div class="entry-meta">${esc(t(p.meta))}</div>` : ""}
        </div>
        ${p.link ? `<div class="entry-sub">${p.link.split(" · ").map(u =>
            `<a class="plain" href="${esc(href(u))}">${esc(u)}</a>`).join(" · ")}</div>` : ""}
      </div>
      ${bullets(p.bullets)}
    </article>`).join("");
  return section(t(DATA.labels.projects), inner);
}

function renderSkills(){
  /* Spoken languages are the last row here rather than a section of their own:
     a heading for one line cost the space that kept this CV on two pages. */
  const spoken = DATA.languages.map(l => `${t(l.name)} — ${t(l.level)}`).join("; ");
  const rows = [...DATA.skills.map(s => [t(s.label), t(s.value)]), [t(DATA.labels.spoken), spoken]];
  const inner = `<dl class="skills">${rows.map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  return section(t(DATA.labels.skills), inner);
}

function renderEducation(){
  const inner = DATA.education.map(e => `
    <div class="entry edu-item">
      <div class="entry-title">${esc(t(e.degree))}</div>
      <div class="entry-sub">${esc(t(e.school))} · ${esc(fmtRange(e.from, e.to))}${e.note ? " · " + esc(t(e.note)) : ""}</div>
    </div>`).join("");
  /* The dates sit inline after the school rather than right-aligned: a
     right-aligned date on a short line was read by a parser as a separate
     block and attached to the next section. */
  return section(t(DATA.labels.education), inner);
}

function renderCertificates(){
  /* One flowing paragraph, semicolon-separated: still a single text run in
     reading order for a parser, at a third of the height of a list. */
  const inner = `<p class="langs">${DATA.certificates.map(c => esc(t(c))).join("; ")}.</p>`;
  return section(t(DATA.labels.certificates), inner);
}

function renderReferences(){
  /* One paragraph, like Languages: résumé parsers don't extract references,
     so four one-line entries were spending space the two-page limit needs. */
  const inner = `<p class="langs">${DATA.references.map(r =>
      `<span class="ref-name">${esc(r.name)}</span> — ${esc(t(r.org))}`).join("; ")}.
    <span class="note">${esc(t(DATA.labels.refsNote))}</span></p>`;
  return section(t(DATA.labels.references), inner);
}

/* structured data, so CV-parsing tools and LLMs get unambiguous fields */
function renderJsonLd(){
  const c = DATA.contact;
  const current = DATA.experience.find(j => j.to === null);
  const person = {
    "@context": "https://schema.org",
    "@type": "Person",
    name: DATA.name,
    jobTitle: t(DATA.role),
    description: plain(t(DATA.summary)),
    email: "mailto:" + c.email,
    url: href(c.site),
    address: { "@type": "PostalAddress", addressLocality: "Istanbul", addressCountry: "TR" },
    sameAs: [href(c.github), href(c.linkedin), href(c.org)],
    knowsAbout: DATA.skills.flatMap(s => t(s.value).split(", ")),
    knowsLanguage: DATA.languages.map(l => ({ "@type": "Language", name: t(l.name), alternateName: l.code })),
    alumniOf: DATA.education.map(e => ({ "@type": "EducationalOrganization", name: t(e.school) })),
    hasCredential: DATA.certificates.map(x => ({
      "@type": "EducationalOccupationalCredential", name: t(x)
    }))
  };
  if (c.showPhone) person.telephone = c.phone;
  if (current) person.worksFor = { "@type": "Organization", name: t(current.org) };

  let el = document.getElementById("ld");
  if (!el) {
    el = document.createElement("script");
    el.type = "application/ld+json";
    el.id = "ld";
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(person, null, 2);
}

function setFontSize(pt){
  FS = Math.min(13, Math.max(8, Math.round(pt * 10) / 10));
  document.documentElement.style.setProperty("--fs", FS + "pt");
  const out = document.getElementById("fs-readout");
  if (out) out.textContent = FS.toFixed(1) + "pt";
  try { localStorage.setItem("cv-fs", String(FS)); } catch (e) {}
}

function render(){
  document.documentElement.lang = LANG;
  document.title = `${DATA.name} — ${t(DATA.role)} — CV`;
  document.getElementById("sheet").innerHTML =
    renderHeader() +
    section(t(DATA.labels.summary), `<p class="summary">${rich(t(DATA.summary))}</p>`) +
    renderSkills() +
    renderExperience() +
    renderProjects() +
    renderEducation() +
    renderCertificates() +
    /* Single column throughout: parsers read a PDF by lines, and two lists side
       by side come out interleaved (one line of each list run together). */
    (DATA.showReferences ? renderReferences() : "");
  renderJsonLd();

  document.getElementById("btn-en").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("btn-tr").setAttribute("aria-pressed", String(LANG === "tr"));
}

function setLang(lang, updateHash){
  LANG = (lang === "tr") ? "tr" : "en";
  try { localStorage.setItem("cv-lang", LANG); } catch (e) {}
  if (updateHash) history.replaceState(null, "", LANG === "tr" ? "#tr" : "#en");
  render();
}

/* bake the rendered DOM into a script-free HTML file */
function exportStatic(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll('.toolbar, noscript, script:not([type="application/ld+json"])')
       .forEach(n => n.remove());
  const blob = new Blob(["<!doctype html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Ahmetcan-Aksu-CV-${LANG.toUpperCase()}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* initial language: URL hash > ?lang= > saved choice > en */
(function init(){
  const hash = location.hash.replace("#", "").toLowerCase();
  const qs = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("cv-lang"); } catch (e) {}
  setLang(hash || qs || saved || "en", false);

  document.getElementById("btn-en").onclick = () => setLang("en", true);
  document.getElementById("btn-tr").onclick = () => setLang("tr", true);
  let savedFs = null;
  try { savedFs = parseFloat(localStorage.getItem("cv-fs")); } catch (e) {}
  setFontSize(Number.isFinite(savedFs) ? savedFs : (DATA.layout && DATA.layout.baseFontPt) || 10.4);

  document.getElementById("btn-smaller").onclick = () => setFontSize(FS - 0.2);
  document.getElementById("btn-bigger").onclick  = () => setFontSize(FS + 0.2);
  document.getElementById("btn-print").onclick = () => window.print();
  document.getElementById("btn-bake").onclick = exportStatic;
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "").toLowerCase();
    if (h === "en" || h === "tr") setLang(h, false);
  });
})();
</script>
