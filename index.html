    <!--
      First visit to the English root from a Turkish browser: go to /tr/, keeping
      the #/page. Only "/" is ever redirected — an explicit /tr/ link is never
      bounced back, and a choice made with the EN/TR switch (stored under "lang")
      wins over the browser. Crawlers send English, so they are never redirected.
    -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          if (p !== "/" && p !== "/index.html") return;
          var saved = null;
          try { saved = localStorage.getItem("lang"); } catch (e) {}
          var wantsTr = saved
            ? saved === "tr"
            : /^tr\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
          if (wantsTr) location.replace("/tr/" + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
